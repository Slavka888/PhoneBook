<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Телефонный справочник</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Наши стили -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container py-5">
    <div class="row">
        <!-- Заголовок -->
        <div class="col-12 text-center mb-4">
            <h1 class="display-5 fw-bold">
                <i class="bi bi-telephone-fill text-primary"></i>
                Телефонный справочник
            </h1>
            <p class="text-muted">Управление контактами</p>
        </div>

        <!-- Форма добавления / редактирования -->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" id="formTitle">
                        <i class="bi bi-person-plus"></i> Новый контакт
                    </h5>
                </div>
                <div class="card-body">
                    <form id="contactForm">
                        <!-- Скрытое поле для ID (при редактировании) -->
                        <input type="hidden" id="contactId" />

                        <div class="mb-3">
                            <label for="username" class="form-label">Имя *</label>
                            <input type="text" class="form-control" id="username" required />
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" />
                        </div>

                        <div class="mb-3">
                            <label for="mobile" class="form-label">Мобильный</label>
                            <input type="text" class="form-control" id="mobile" placeholder="+7-999-123-4567" />
                        </div>

                        <div class="mb-3">
                            <label for="home" class="form-label">Домашний</label>
                            <input type="text" class="form-control" id="home" placeholder="+7-495-111-2233" />
                        </div>

                        <div class="d-grid gap-2 d-md-flex">
                            <button type="submit" class="btn btn-primary" id="saveBtn">
                                <i class="bi bi-save"></i> Сохранить
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">
                                <i class="bi bi-x-circle"></i> Отмена
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Список контактов -->
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="bi bi-list-ul"></i> Список контактов
                        <span class="badge bg-secondary" id="contactCount">0</span>
                    </h5>
                    <button class="btn btn-danger btn-sm" id="deleteAllBtn">
                        <i class="bi bi-trash3"></i> Удалить все
                    </button>
                </div>
                <div class="card-body p-0">
                    <div id="contactsList" class="list-group list-group-flush">
                        <!-- Контакты будут загружаться сюда -->
                        <div class="list-group-item text-center text-muted py-4">
                            <i class="bi bi-inbox fs-1 d-block"></i>
                            Нет контактов
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Скрипты -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
